<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Click a button and watch one word become the next."
    />
    <title>Wordshift — A Tiny Word Machine</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="glow glow-one" aria-hidden="true"></div>
      <div class="glow glow-two" aria-hidden="true"></div>

      <section class="word-card" aria-labelledby="changing-title">
        <p class="eyebrow">A tiny word machine</p>

        <div class="title-wrap">
          <span class="title-number" id="title-number" aria-hidden="true">01</span>
          <h1 id="changing-title" aria-live="polite">Imagine</h1>
        </div>

        <p class="description">
          One click. One new word. A small reminder that change can be simple.
        </p>

        <button id="next-word" type="button">
          <span>Next word</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>

        <div class="progress" id="progress" aria-hidden="true">
          <span class="active"></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </section>

      <p class="corner-note" aria-hidden="true">Click · Change · Continue</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
